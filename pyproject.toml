[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devicewatchos"
version = "1.0.0"
description = "Security and health monitoring MVP for Linux devices, kiosks, signage players, and edge systems"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.scripts]
device-watch = "agent.main:main"
